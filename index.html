<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Study Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- HEADER -->
    <header>
        <h1>Student Study Planner</h1>

        <nav>
            <a href="#dashboard">Dashboard</a>
            <a href="#tasks">All Tasks</a>
            <a href="#calendar">Calendar</a>
        </nav>

        <button id="theme-button" type="button">☀</button>
    </header>

    <main>
        <!-- DASHBOARD -->
        <section id="dashboard">
            <h2>Dashboard</h2>

            <!-- ADD NEW TASK -->
            <div class="add-task-section">

                <h3>Add New Task</h3>

                <form id="task-form">

                    <label for="task-title">Task Title</label>
                    <input
                        type="text"
                        id="task-title"
                        placeholder="Enter task title"
                        required
                    >
                    <label for="due-date">Due Date</label>
                    <input
                        type="date"
                        id="due-date"
                        required
                    >
                    <label for="priority">Priority</label>
                    <select id="priority" required>
                        <option value="">Select priority</option>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>

                    <button type="submit">Add Task</button>
                </form>
            </div>

            <!-- PROGRESS -->
            <div class="progress-section">

                <h3>Progress</h3>

                <div class="progress-bar">
                    <div id="progress-fill"></div>
                </div>

                <p id="progress-text">0 of 0 completed (0%)</p>

            </div>
        </section>

        <!-- ALL TASKS -->
        <section id="tasks">

            <h2>All Tasks</h2>

            <!-- FILTERS -->
            <div class="filters">

                <button type="button" data-filter="all">All</button>
                <button type="button" data-filter="pending">Pending</button>
                <button type="button" data-filter="completed">Completed</button>

            </div>

            <!-- SORT -->
            <div class="sort-section">

                <label for="sort-tasks">Sort by:</label>

                <select id="sort-tasks">
                    <option value="default">Default</option>
                    <option value="date">Due Date</option>
                    <option value="priority">Priority</option>
                </select>

            </div>

            <!-- TASK LIST -->
            <div id="task-list">
                <!-- JavaScript will add the tasks here -->
            </div>
        </section>

        <!-- CALENDAR -->
        <section id="calendar">

            <h2>Calendar</h2>

            <div class="calendar-header">
                <button id="previous-month" type="button">&lt;</button>

                <h3 id="calendar-month"></h3>

                <button id="next-month" type="button">&gt;</button>
            </div>

            <div id="calendar-grid">
                <!-- JavaScript will generate the calendar here -->
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>Student Study Planner</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
